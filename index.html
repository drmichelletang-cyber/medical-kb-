<style>
:root{--navy:#1E2761;--gold:#C5993A;--cream:#F5F0E8;--ink:#23262e;--line:#e3dccb;--paper:#fbf8f1;--muted:#8a8675;
--serif:"Noto Serif TC","Songti TC",Georgia,serif;--sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:baseline;gap:18px;border-bottom:3px solid var(--gold);flex:0 0 auto}
header h1{font-family:var(--serif);font-size:20px;margin:0;letter-spacing:.04em;font-weight:600}
header .sub{color:#c9cbe0;font-size:12px;letter-spacing:.05em}
header .stats{margin-left:auto;display:flex;gap:16px;font-size:12px}
header .stats b{font-family:var(--serif);font-size:17px;color:var(--gold);display:block;line-height:1}
header .stats span{color:#b9bcd4;font-size:10.5px;letter-spacing:.08em}
.stat{text-align:right}
.wrap{flex:1;display:flex;min-height:0}
nav{width:300px;flex:0 0 auto;background:var(--paper);border-right:1px solid var(--line);overflow:auto;padding:14px 0}
.hubrow{margin:0 16px 10px;padding:9px 12px;border-radius:8px;background:var(--navy);color:#fff;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600}
.hubrow:hover{background:#2a3478}.hubrow.active{outline:2px solid var(--gold)}
nav .search{padding:0 16px 10px}
nav input{width:100%;padding:8px 11px;border:1px solid var(--line);background:#fff;border-radius:7px;font-family:var(--sans);font-size:13px;color:var(--ink)}
nav input:focus{outline:none;border-color:var(--gold)}
.group-h{font-size:11px;letter-spacing:.12em;color:var(--muted);padding:9px 16px 5px;font-weight:600}
.item{display:flex;align-items:center;gap:8px;padding:7px 16px 7px 22px;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;color:#3a3d44}
.item:hover{background:#f1ebdd}
.item.active{background:#eee4cf;border-left-color:var(--gold);color:var(--navy);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.v{background:#3f8f5b}.dot.u{background:var(--gold)}.dot.n{background:#c4bca6}
main{flex:1;overflow:auto;padding:38px 50px 80px}
.reading{max-width:760px;margin:0 auto;animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.crumb{font-size:11.5px;color:var(--muted);letter-spacing:.08em;margin-bottom:4px}
.props{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin:14px 0 26px;font-size:13px}
.props .row{display:flex;gap:10px;padding:3px 0;align-items:baseline}
.props .k{flex:0 0 86px;color:var(--muted);font-size:11.5px;letter-spacing:.06em}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:30px;font-size:12px;font-weight:600}
.badge.v{background:#e4f0e8;color:#2c6b43;border:1px solid #bcdcc7}
.badge.u{background:#f6ecd6;color:#956c19;border:1px solid #e6d3a4}
.chip{display:inline-block;padding:2px 10px;margin:2px 5px 2px 0;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:11.5px;color:#5a5647}
.chip.link{cursor:pointer;border-color:#cdd0e6;color:var(--navy);background:#f3f4fb}
.chip.link:hover{background:var(--navy);color:#fff}
.tag{background:#f6ecd6;color:#956c19;padding:1px 8px;border-radius:5px;font-size:.9em;font-weight:600}
.note{font-family:var(--serif);line-height:1.85;font-size:16px;color:#2b2e36}
.note h1{font-size:27px;color:var(--navy);margin:.2em 0 .5em;line-height:1.3;border-bottom:2px solid var(--gold);padding-bottom:.3em;display:inline-block}
.note h2{font-size:20px;color:var(--navy);margin:1.5em 0 .5em;font-weight:600}
.note h3{font-size:16.5px;color:#3a3d6b;margin:1.2em 0 .4em}
.note p{margin:.7em 0}.note ul,.note ol{margin:.6em 0;padding-left:1.4em}.note li{margin:.32em 0}

.note table{border-collapse:collapse;width:100%;margin:1em 0;font-family:var(--sans);font-size:13px}
.note th{background:var(--navy);color:#fff;padding:8px 11px;text-align:left}
.note td{padding:8px 11px;border-bottom:1px solid var(--line)}
.note tr:nth-child(even) td{background:var(--paper)}
.note code{background:#eee4cf;padding:1px 6px;border-radius:5px;font-size:.88em;font-family:ui-monospace,Menlo,monospace;color:#6e5a2e}
.note pre{background:#1f2233;color:#e6e6f0;padding:14px 16px;border-radius:9px;overflow:auto;font-size:13px}

.note a.wl{color:var(--navy);text-decoration:none;border-bottom:1.5px solid var(--gold);cursor:pointer}

.note hr{border:none;border-top:1px solid var(--line);margin:1.6em 0}
.hint{color:var(--muted);font-size:12px;margin-top:36px;font-family:var(--sans);border-top:1px solid var(--line);padding-top:14px}
.hub{animation:fade .4s both}
.hub .lede{font-family:var(--serif);font-size:15px;color:#5a5647;margin:2px 0 24px;max-width:640px;line-height:1.75}
.pipe{display:flex;align-items:stretch;margin:0 0 6px;flex-wrap:wrap}
.pstep{flex:1;min-width:128px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
.pstep .n{font-family:var(--serif);color:var(--gold);font-size:12px;font-weight:700}
.pstep .t{font-size:13px;color:var(--navy);font-weight:600;margin:3px 0}
.pstep .d{font-size:11px;color:var(--muted);line-height:1.5}
.parrow{display:flex;align-items:center;color:var(--gold);font-size:17px;padding:0 5px}
.pipenote{font-size:11.5px;color:var(--muted);margin:0 0 26px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px 16px}
.tile b{font-family:var(--serif);font-size:29px;color:var(--navy);display:block;line-height:1}
.tile.v b{color:#2c6b43}.tile.u b{color:#956c19}
.tile span{font-size:11.5px;color:var(--muted)}
.sect{margin:28px 0 10px;font-family:var(--serif);font-size:17px;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:6px}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);margin:6px 0;cursor:pointer;font-size:13.5px;color:#3a3d44}
.qrow:hover{border-color:var(--gold);background:#faf3e2}
.qrow .qb{margin-left:auto;font-size:11px;color:#956c19;background:#f6ecd6;border:1px solid #e6d3a4;padding:2px 9px;border-radius:20px;font-weight:600}
.qrow .qb.v{color:#2c6b43;background:#e4f0e8;border-color:#bcdcc7}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pcard{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff;cursor:pointer}
.pcard:hover{border-color:var(--gold);background:#faf3e2}
.pcard .pc{font-family:var(--serif);color:var(--navy);font-weight:600;font-size:14px}
.pcard .pp{font-size:10.5px;color:var(--muted);margin-top:3px}
.menubtn{display:none}
@media(max-width:760px){nav{position:fixed;z-index:5;height:calc(100% - 56px);transform:translateX(-100%);transition:.25s}nav.open{transform:none}
main{padding:24px 20px 70px}header .stats{display:none}.menubtn{display:inline-block;background:none;border:1px solid #4a4f86;color:#fff;border-radius:7px;padding:4px 10px;cursor:pointer}
.tiles{grid-template-columns:repeat(2,1fr)}.pgrid{grid-template-columns:1fr 1fr}.pipe{flex-direction:column}.parrow{transform:rotate(90deg);padding:3px 0}}

<script>
const NOTES=[{"id": "00 索引地圖", "folder": ".", "file": "00 索引地圖", "title": "🗺️ 叮噹長壽知識庫 — 索引地圖", "fm": {"type": "moc", "tags": ["moc"]}, "body": "# 🗺️ 叮噹長壽知識庫 — 索引地圖\n\n整個知識層以 **9S 框架** 為中心，**老年醫學證據** 為地基。\n\n## 中央樞紐\n- [[9S 總覽]]\n- [[三大健康斷崖]]\n- [[核心 Simplicity 大道至簡]]\n\n## 九大支柱\n- [[S1 Survey 居安思危]] — 盤點\n- [[S2 Sleep 天人合一]] — 睡眠\n- [[S3 Stress 知己知彼]] — 壓力\n- [[S4 Strength 厚積薄發]] — 肌力\n- [[S5 Sustenance 藥食同源]] — 營養\n- [[S6 Sharpness 機先一著]] — 銳智\n- [[S7 Sensitivity 感而遂通]] — 感知\n- [[S8 Social 仁者壽長]] — 關係\n- [[S9 Strategy 以終為始]] — 整合\n\n## 地基\n- [[_證據庫索引]]\n\n## 臨床主題\n- [[_臨床主題索引]]\n"}, {"id": "CLAUDE", "folder": ".", "file": "CLAUDE", "title": "CLAUDE.md — 叮噹長壽知識庫", "fm": {}, "body": "# CLAUDE.md — 叮噹長壽知識庫\n\n## 這是什麼\n一個 **Markdown 知識庫**：以 9S 框架為中心、老年醫學證據為地基。\n**真相來源 = 這些 `.md` 檔。** 不綁定任何特定 app，可用任何 Markdown 編輯器開啟。\n\n## 鐵則\n1. **只改 `.md`，永遠不要手改任何 HTML。** HTML 是拋棄式衍生視圖。\n2. 改完內容後，用下列指令重生 HTML：\n   ```bash\n   python3 _tools/產生HTML.py\n   ```\n3. **引用前一律查核。** 單一觀察性研究不足以支撐學術論述。\n\n## 資料夾\n- `00 索引地圖` 入口\n- `01 9S框架` 九支柱 + 三大健康斷崖 + 核心哲學（中央樞紐）\n- `02 老年醫學證據庫` 每篇文獻一個 note\n- `03 臨床主題` 臨床議題，連回支柱與證據\n- `_tools` 產生器\n- `_範本` 新增 note 範本\n\n## 新增筆記時\n- 照 `_範本/` 的格式寫 frontmatter。\n- 證據 note 必填：`type: evidence`、`citation`、`year`、`journal`、`study_type`、`evidence_grade`、`verified`、`supports`。\n- **除非已調全文確認，否則 `verified: false` 並加 `#待查核`。** 不要把未查核的數字當成已確認。\n- 用 `[[ ]]` 把新筆記連回對應的 9S 支柱／斷崖／相關證據（這些連結會驅動 HTML 的跳轉）。\n- 保留當時查出來的「使用眉角」（例外、被打臉的數字、外推限制）——那是這個庫最值錢的部分。\n\n## 不放這裡\n- **語氣／人格層不放知識庫。** 品牌語調、金句等在輸出時依工具各自設定。\n- 行銷／商業策略屬週邊，不是知識層核心。\n\n## 連結慣例\n`[[筆記檔名]]` 或 `[[檔名|顯示文字]]`；frontmatter 的 `supports:` 用 `[\"[[...]]\"]` 串內部連結。\n產生器會解析這些連結成可點跳轉；frontmatter 會渲染成屬性卡與查核狀態徽章。\n"}, {"id": "README 使用說明", "folder": ".", "file": "README 使用說明", "title": "叮噹長壽知識庫 — 使用說明", "fm": {"type": "meta", "tags": ["meta"]}, "body": "# 叮噹長壽知識庫 — 使用說明\n\n這是一個 **Markdown 知識庫**：本質就是一個裝純文字 `.md` 檔的資料夾，**不綁定任何軟體**。\n\n- **真相來源** = 這些 `.md` 檔\n- **閱讀** = 用 `_tools/產生HTML.py` 重生的 HTML 瀏覽器\n- **編寫** = 任何文字編輯器，或交給 Claude Code\n- **不綁定任何特定 app**：可用任何文字／Markdown 編輯器開啟。\n  但這只是其中一種閱讀器，**本庫不依賴它**——`[[連結]]` 與 frontmatter 是我們自己的慣例，HTML 產生器會讀它們。\n\n## 資料夾\n- `00 索引地圖` 入口 MOC\n- `01 9S框架` 中央樞紐：九支柱 + 三大斷崖 + 核心哲學\n- `02 老年醫學證據庫` 地基：每篇文獻一個 note，附查核狀態\n- `03 臨床主題` 各臨床議題，連回支柱與證據\n- `_tools` 產生器（重生 HTML 的引擎）\n- `_範本` 新增 note 範本\n\n## Frontmatter 欄位\n證據：type/citation/year/journal/study_type/evidence_grade/verified/verified_date/supports\n支柱：type/pillar_code/philosophy\n\n## 查核工作流（鐵則：引用前一律查核）\n- `verified: true` 已調全文／確認出處，可用於書籍與正式簡報\n- `verified: false` + `#待查核` 用前必須回核\n- 搜尋 `#待查核` 可列出所有待辦\n\n## 重生 HTML\n```bash\npython3 _tools/產生HTML.py\n```\n**永遠改 `.md`，不要手改 HTML。** HTML 是拋棄式衍生視圖。\n（frontmatter 一併保留，供日後若想做即時查詢用——選配。）\n"}, {"id": "如何給 Claude Code 使用", "folder": ".", "file": "如何給 Claude Code 使用", "title": "如何把這個知識庫交給 Claude Code", "fm": {}, "body": "# 如何把這個知識庫交給 Claude Code\n\n> 這個資料夾就是知識庫本體（純文字 Markdown）。\n> Claude Code 看不到它，**唯一原因**是：Claude Code 只看得到它「啟動所在的那個資料夾」及其底下的東西。\n> 你的知識庫如果還躺在「下載」資料夾、或還是一個沒解壓的 .zip、或 Claude Code 是在別的專案啟動的，它自然看不到。\n> 解法就是把這個資料夾放到一個固定位置，然後讓 Claude Code 在那裡啟動。\n\n---\n\n## 路徑 A — 最快：放成 Mac 上的一個資料夾\n\n```bash\n# 1. 解壓縮（假設 zip 在下載資料夾）\ncd ~/Downloads\nunzip 叮噹長壽知識庫.zip -d ~/Documents/\n\n# 2. 進到資料夾\ncd ~/Documents/叮噹長壽知識庫\n\n# 3. 在這裡啟動 Claude Code（關鍵就是這一步）\nclaude\n```\n\n現在 Claude Code 的工作目錄就是知識庫，它讀得到全部 45 篇筆記了。\n（用桌面版 / Cowork 的話，就把這個資料夾「加進工作區 / 允許的目錄」，效果一樣。）\n\n---\n\n## 路徑 B — 推薦：放進 Git Repo（長期真相來源）\n\n這條路符合我們定的原則：vault 是唯一真相來源、跨裝置、不依賴單一機器或對話。\n\n```bash\n# 1. 解壓並進入\nunzip ~/Downloads/叮噹長壽知識庫.zip -d ~/Documents/\ncd ~/Documents/叮噹長壽知識庫\n\n# 2. 初始化 git\ngit init\ngit add .\ngit commit -m \"知識庫初版：9S 為中心、老年醫學為地基（45 篇）\"\n\n# 3. 在 GitHub 開一個新 repo（例如 drtingtang-knowledge），然後：\ngit remote add origin git@github.com:你的帳號/drtingtang-knowledge.git\ngit branch -M main\ngit push -u origin main\n\n# 4. 在 repo 目錄啟動 Claude Code\nclaude\n```\n\n之後任何裝置：`git clone` 下來、在裡面開 Claude Code，就是同一個庫。\n\n---\n\n## 重生 HTML 門面\n\n知識庫改完之後，要更新那個 HTML 瀏覽器：\n\n```bash\npython3 _tools/產生HTML.py\n```\n\n會在資料夾根目錄生出 `叮噹長壽知識庫_瀏覽器.html`，用瀏覽器打開即可。\n（這支腳本是「拋棄式衍生視圖」的引擎——永遠改 .md、不要手改 HTML。）\n\n未來若想自動化（你動 .md 它就自動重生），再加一支檔案監看器即可，這是下一步的工程件。\n\n---\n\n## 一句話原則\n\n**地基是這個資料夾，不是任何 app。** Claude Code 負責「寫與連」，HTML 負責「給你看」，\n這個資料夾負責「是真相」。把它放進 repo，整套系統就活在你手上、不再依賴任何一次對話。\n"}, {"id": "部署到網站", "folder": ".", "file": "部署到網站", "title": "部署到網站（GitHub Pages + Lovable /medical）", "fm": {}, "body": "# 部署到網站（GitHub Pages + Lovable /medical）\n\n把這個知識庫的 HTML 介面接到 `www.drtingtang123.com/medical`，用 Lovable 平台密碼頁「防君子」。\n\n## 架構\n1. `.md` = 真相來源（這個 repo，維持私人）。\n2. 跑 `python3 _tools/產生HTML.py` → 產生 `index.html`（自帶全部資料的靜態頁）。\n3. GitHub Pages 把 `index.html` 發布成公開網址。\n4. Lovable 站的 `/medical` 頁用平台密碼鎖住，內嵌（iframe）或用按鈕在新分頁開啟那個網址。\n\n## 步驟 A：開啟 GitHub Pages（在 GitHub 網站操作一次）\n1. 進 repo `medical-kb-` → **Settings → Pages**。\n2. **Build and deployment → Source**：選 **Deploy from a branch**。\n3. **Branch**：選 `claude/sweet-hopper-ckn6il`，資料夾 `/ (root)` → **Save**。\n4. 等約 1 分鐘，網址會是：\n   `https://drmichelletang-cyber.github.io/medical-kb-/`\n\n> ⚠️ 私人 repo 要發布 Pages 需要 **GitHub Pro**。若沒有 Pro：\n> 要嘛把 repo 設為公開（Settings → General → Danger Zone → Change visibility），\n> 要嘛改走「把 index.html 放進 Lovable 專案」的方案。\n> 不論哪種，真正的密碼防護都在 Lovable 那一層。\n\n## 步驟 B：在 Lovable 加 /medical 頁（把下面整段貼給 Lovable）\n\n```\n在我的網站新增一個受密碼保護的頁面，路徑 /medical。\n\n需求：\n- 進入 /medical 先顯示密碼輸入框（單一共用密碼，先用 \"ting2026\"，之後可改）。\n  密碼正確才顯示內容，錯誤顯示提示。\n- 密碼正確狀態用 sessionStorage 記住，重新整理不用再輸入。\n- 密碼正確後，頁面標題「叮噹長壽知識庫」，下方放：\n  (1) 一個全寬、約 80vh 高的 <iframe>，src =\n      https://drmichelletang-cyber.github.io/medical-kb-/\n  (2) 一個按鈕「在新分頁開啟」，target=\"_blank\" rel=\"noopener\"，連同一網址。\n- 配色：深藍 #1E2761 + 金色 #C5993A，風格簡潔，與品牌一致。\n```\n\n## 更新內容時\n1. 只改 `.md`。\n2. 跑 `python3 _tools/產生HTML.py` 重生 `index.html`。\n3. commit + push → GitHub Pages 自動更新 → `/medical` 也跟著更新。\n"}, {"id": "9S 總覽", "folder": "01 9S框架", "file": "9S 總覽", "title": "9S 長壽佈局框架 — 總覽", "fm": {"type": "pillar", "pillar_code": "9S", "philosophy": "大道至簡（道德經）", "aliases": ["9S", "9S框架", "九大支柱", "長壽佈局"], "tags": ["9S", "框架"]}, "body": "# 9S 長壽佈局框架 — 總覽\n\n- **英文名稱**：Dr TingTang's Art of Longevity\n- **核心理念**：這不是養生課，這是你後半場的作戰計畫。\n- **設計哲學**：西方醫學實證，融合兩千五百年中華養生智慧\n- **架構**：1 核心哲學 + 1 盤點章 + 7 實戰支柱 + 1 整合策略章\n\n## 四大教學原則\n1. 不靠意志力\n2. 不削足適履\n3. 找到你的節律\n4. 讓好習慣更容易開始\n\n## 三層結構\n- 導入層：[[核心 Simplicity 大道至簡]] × [[S1 Survey 居安思危]]\n- 執行層：[[S2 Sleep 天人合一]]・[[S3 Stress 知己知彼]]・[[S4 Strength 厚積薄發]]・[[S5 Sustenance 藥食同源]]・[[S6 Sharpness 機先一著]]・[[S7 Sensitivity 感而遂通]]・[[S8 Social 仁者壽長]]\n- 整合層：[[S9 Strategy 以終為始]]\n\n## 相關\n- [[三大健康斷崖]]\n"}, {"id": "S1 Survey 居安思危", "folder": "01 9S框架", "file": "S1 Survey 居安思危", "title": "Survey（居安思危）", "fm": {"type": "pillar", "pillar_code": "S1", "pillar_en": "Survey", "philosophy": "居安思危（左傳）", "aliases": ["Survey", "S1", "盤點"], "tags": ["9S", "支柱"]}, "body": "# Survey（居安思危）\n\n**定位**：盤點章，課程起點。先知道自己站在哪裡，才能規劃往哪裡去。\n\n## 三大核心內容\n1. 五大系統健康問卷（睡眠、壓力、肌骨、感知、認知）\n2. 優勢性格測試\n3. 個人化佈局宣言\n\n## 東方智慧\n居安思危——出自左傳。\n\n## 連結\n- 框架：[[9S 總覽]]\n- 斷崖：[[三大健康斷崖]]\n- 證據：（待掛入相關文獻）\n"}, {"id": "S2 Sleep 天人合一", "folder": "01 9S框架", "file": "S2 Sleep 天人合一", "title": "Sleep（天人合一）", "fm": {"type": "pillar", "pillar_code": "S2", "pillar_en": "Sleep", "philosophy": "天人合一（道家・黃帝內經）", "aliases": ["Sleep", "S2", "睡眠"], "tags": ["9S", "支柱"]}, "body": "# Sleep（天人合一）\n\n**定位**：睡眠是所有健康的地基。\n\n## 三大核心內容\n1. 皮質醇節律失調根源與修復——是整個晝夜節律系統的校準\n2. 三個最小有效介入：光線・溫度・時間錨點\n3. 睡眠品質是預測認知退化的最早期指標之一\n\n## 東方智慧\n天人合一——出自道家・黃帝內經。\n\n## 連結\n- 框架：[[9S 總覽]]\n- 斷崖：[[三大健康斷崖]]\n- 證據：（待掛入相關文獻）\n"}, {"id": "S3 Stress 知己知彼", "folder": "01 9S框架", "file": "S3 Stress 知己知彼", "title": "Stress（知己知彼）", "fm": {"type": "pillar", "pillar_code": "S3", "pillar_en": "Stress", "philosophy": "知己知彼（孫子兵法）", "aliases": ["Stress", "S3", "壓力"], "tags": ["9S", "支柱"]}, "body": "# Stress（知己知彼）\n\n**定位**：壓力管理不是消除壓力，是認識並善用它。\n\n## 三大核心內容\n1. 榮格「生命下午」框架——47 歲轉場，中年不是危機而是轉型\n2. 存在性壓力 vs 外在壓力的雙層介入\n3. HRV 心率變異度作為壓力指標\n\n## 東方智慧\n知己知彼——出自孫子兵法。\n\n## 連結\n- 框架：[[9S 總覽]]\n- 斷崖：[[三大健康斷崖]]\n- 證據：（待掛入相關文獻）\n"}, {"id": "S4 Strength 厚積薄發", "folder": "01 9S框架", "file": "S4 Strength 厚積薄發", "title": "Strength（厚積薄發）", "fm": {"type": "pillar", "pillar_code": "S4", "pillar_en": "Strength", "philosophy": "厚積薄發（蘇軾）", "aliases": ["Strength", "S4", "肌力", "肌少症"], "tags": ["9S", "支柱"]}, "body": "# Strength（厚積薄發）\n\n**定位**：肌肉是長壽的貨幣。\n\n## 三大核心內容\n1. 肌少症三大風險指標與自我評估\n2. 60% 起步原則——不需要完美，先建立節律\n3. BDNF 橋接：運動如何同時保護大腦\n\n## 東方智慧\n厚積薄發——出自蘇軾。\n\n## 連結\n- 框架：[[9S 總覽]]\n- 斷崖：[[三大健康斷崖]]\n- 證據：[[EMBRAZE 2026 apitegromab 保肌]]、[[Lu 2026 華人肌肉量常模]]、[[Wang 2024 華人肌肉量軌跡]]、[[AWGS 2025 肌少症診斷標準]]、[[Lee 2020 站立式BIA預測握力]]\n- 主題：[[GLP-1 減重藥與肌肉流失]]\n"}, {"id": "S5 Sustenance 藥食同源", "folder": "01 9S框架", "file": "S5 Sustenance 藥食同源", "title": "Sustenance（藥食同源）", "fm": {"type": "pillar", "pillar_code": "S5", "pillar_en": "Sustenance", "philosophy": "藥食同源（黃帝內經）", "aliases": ["Sustenance", "S5", "營養", "代謝"], "tags": ["9S", "支柱"]}, "body": "# Sustenance（藥食同源）\n\n**定位**：營養不是節食，是讓身體學會靈活切換。\n\n## 三大核心內容\n1. 代謝靈活性：身體能切換燃料來源嗎？\n2. 蛋白質時機——肌肉合成的黃金窗口\n3. 血糖穩定與認知銳利度的直接關聯\n\n## 東方智慧\n藥食同源——出自黃帝內經。\n\n## 連結\n- 框架：[[9S 總覽]]\n- 斷崖：[[三大健康斷崖]]\n- 證據：[[CALERIE 熱量限制與生物老化]]、[[Oxford 2022 酒精與端粒]]、[[Sydney 2026 減脂優於換植物蛋白]]\n- 主題：[[熱量限制與間歇性斷食]]、[[酒精與華人老化]]、[[抗老保健品的真相]]\n"}, {"id": "S6 Sharpness 機先一著", "folder": "01 9S框架", "file": "S6 Sharpness 機先一著", "title": "Sharpness（機先一著）", "fm": {"type": "pillar", "pillar_code": "S6", "pillar_en": "Sharpness", "philosophy": "機先一著（棋道）", "aliases": ["Sharpness", "S6", "銳智", "認知"], "tags": ["9S", "支柱"]}, "body": "# Sharpness（機先一著）\n\n**定位**：認知能力可以被訓練和保護。\n\n## 三大核心內容\n1. 四大認知功能：工作記憶・處理速度・執行功能・認知靈活性\n2. 認知儲備理論與實證介入\n3. 血液檢測新發展：提前掌握失智風險\n\n## 東方智慧\n機先一著——出自棋道。\n\n## 連結\n- 框架：[[9S 總覽]]\n- 斷崖：[[三大健康斷崖]]\n- 證據：[[Rayens 2026 帶疱疫苗與失智]]、[[國衛院 2026 APOE-ε4 認知退化]]\n- 主題：[[失智可改變風險因子]]\n"}, {"id": "S7 Sensitivity 感而遂通", "folder": "01 9S框架", "file": "S7 Sensitivity 感而遂通", "title": "Sensitivity（感而遂通）", "fm": {"type": "pillar", "pillar_code": "S7", "pillar_en": "Sensitivity", "philosophy": "感而遂通（易經）", "aliases": ["Sensitivity", "S7", "感知", "聽力"], "tags": ["9S", "支柱"]}, "body": "# Sensitivity（感而遂通）\n\n**定位**：感官是連接世界的窗口，也是認知退化的早期警報。\n\n## 三大核心內容\n1. 聽力退化與失智風險的研究連結\n2. 感官刺激作為認知儲備的建立方式\n3. 簡易感官功能自我評估\n\n## 東方智慧\n感而遂通——出自易經。\n\n## 連結\n- 框架：[[9S 總覽]]\n- 斷崖：[[三大健康斷崖]]\n- 主題：[[失智可改變風險因子]]（聽力＝中年最大可改變失智風險因子之一）\n"}, {"id": "S8 Social 仁者壽長", "folder": "01 9S框架", "file": "S8 Social 仁者壽長", "title": "Social（仁者壽長）", "fm": {"type": "pillar", "pillar_code": "S8", "pillar_en": "Social", "philosophy": "仁者壽長（論語・雍也）", "aliases": ["Social", "S8", "關係", "社會連結", "孤獨"], "tags": ["9S", "支柱"]}, "body": "# Social（仁者壽長）\n\n**定位**：社會連結是被低估的長壽處方。\n\n## 三大核心內容\n1. 孤獨的生理機制：慢性發炎與神經退化\n2. 關係品質 vs 關係數量\n3. AI 時代的社會連結：工具輔助不能取代真實互動\n\n## 東方智慧\n仁者壽長——出自論語・雍也。\n\n## 連結\n- 框架：[[9S 總覽]]\n- 斷崖：[[三大健康斷崖]]\n- 證據：（待掛入相關文獻）\n"}, {"id": "S9 Strategy 以終為始", "folder": "01 9S框架", "file": "S9 Strategy 以終為始", "title": "Strategy（以終為始）", "fm": {"type": "pillar", "pillar_code": "S9", "pillar_en": "Strategy", "philosophy": "以終為始（易經）", "aliases": ["Strategy", "S9", "整合", "佈局"], "tags": ["9S", "支柱"]}, "body": "# Strategy（以終為始）\n\n**定位**：整合章，將所有學習轉化為個人行動計畫。\n\n## 三大核心內容\n1. 個人化長壽路徑圖生成\n2. 21 天啟動挑戰認證流程\n3. 進階課程入口：基因型佈局・逆齡工程\n\n## 東方智慧\n以終為始——出自易經。\n\n## 連結\n- 框架：[[9S 總覽]]\n- 斷崖：[[三大健康斷崖]]\n- 證據：（待掛入相關文獻）\n"}, {"id": "三大健康斷崖", "folder": "01 9S框架", "file": "三大健康斷崖", "title": "三大健康斷崖", "fm": {"type": "concept", "aliases": ["三大健康斷崖", "健康斷崖", "44", "60", "78"], "tags": ["9S", "核心論述", "斷崖"]}, "body": "# 三大健康斷崖\n\n課程核心銷售論述。三個年齡點對應不同系統的非線性老化加速，強調「提前介入」。\n\n## ⚠️ 兩層論述（戰略級，務必分清）\n- **對外（大眾／節目／行銷）**：用「健康斷崖」——好記、有急迫感，是品牌資產，留著。\n- **對內（醫師／審查委員會／認證場合）**：精準退守版＝「生理**非線性加速**窗口」。資料顯示的是加速、不是字面上的墜落；「斷崖」是科普簡稱。\n- 能在兩層間瞬間切換的是權威，只會講一層的是網紅。\n\n## 三個斷崖，三種證據強度\n- **60 歲 — 最硬的柱子。** 三條獨立證據線匯流：[[Snyder 2024 非線性老化 44-60]]（多體學）、[[Lehallier 2019 血漿蛋白體老化波]]（蛋白體 n=4,263）、[[Pontzer 2021 代謝壽命曲線]]（代謝、雙標水法、>6,000 人）。這應是整套理論的開場，不是配角。\n- **78 歲 — 很穩。** Lehallier 蛋白體找到 78 波峰後，InCHIANTI 獨立世代精準重現。\n- **44 歲 — 軟肋，要心裡有數。** 只來自 Stanford 一篇（n=108、全加州、追蹤中位 1.7 年）。而 Lehallier 的中年波峰是 **34 歲不是 44**；Pontzer 直接說 20–60 歲代謝穩定。要拆框架的人，會打 44。\n\n## 收 44 的守得住講法\n- **改框成「34 起始 / 44 拐點」**：改變 34 歲就悄悄開始，但要到四字頭才大到值得重新佈局。錨定拐點、不是起始點。\n- 44 比較硬的支撐：Stanford 那篇自己的**心血管分子簽名**（44 與 60 共享）＋臨床觀察。\n- **主動引用打臉自己的 Pontzer**：在科普場域，主動引一篇部分反對你的研究＝最強的信任建立。收法：「代謝不是 44 崩盤，44 更像荷爾蒙與分子調控的重整。」\n\n## ⚠️ 兩塊磚的眉角\n- **更年期只能撐 44 的「起始」意義。** 圍停經期最早的荷爾蒙擾動落在四字頭；但停經事件本身約 50 歲，落在 44 與 60 的山谷，不在斷崖上。✅可講「四字頭是女性荷爾蒙過渡開始」；❌不可講「44 是更年期」。\n- **不要用「中年幸福低谷」U 型曲線。** 其主要提倡者 Blanchflower 在 2025 年宣布該曲線已消失。講四字頭的心理負荷可以，但別掛在這個正在碎掉的數據點上。\n\n## 三個斷崖（臨床定位）\n- **44 代謝／荷爾蒙重整** → 超前部署窗口\n- **60 免疫與肌肉陡降** → 最後可逆窗口；連結 [[S4 Strength 厚積薄發]]\n- **78 認知與尊嚴** → 連結 [[Covinsky 2003 住院相關失能]]、[[Boyd 2008 出院後ADL恢復]]\n\n## 鬧鐘 vs 處方\n44 是「統計上多數人訊號匯流、提醒你重新評估」的鬧鐘；真正開處方依據的是**評估結果**，不是歲數。鬧鐘時間可統一，處方因人而異（保住 9S 個人化招牌）。\n"}, {"id": "核心 Simplicity 大道至簡", "folder": "01 9S框架", "file": "核心 Simplicity 大道至簡", "title": "Simplicity（大道至簡）", "fm": {"type": "pillar", "pillar_code": "核心", "pillar_en": "Simplicity", "philosophy": "大道至簡（道德經）", "aliases": ["Simplicity", "大道至簡", "核心哲學"], "tags": ["9S", "支柱"]}, "body": "# Simplicity（大道至簡）\n\n**定位**：貫穿九章的設計哲學\n\n## 東方智慧\n大道至簡——出自道德經。\n\n## 連結\n- 框架：[[9S 總覽]]\n- 斷崖：[[三大健康斷崖]]\n- 證據：（待掛入相關文獻）\n"}, {"id": "4M 高齡友善照護框架", "folder": "02 老年醫學證據庫", "file": "4M 高齡友善照護框架", "title": "4M 高齡友善照護框架", "fm": {"type": "evidence", "citation": "Age-Friendly Health Systems 4M Framework, IHI（出處待補）", "year": 0, "journal": "IHI（框架）", "study_type": "照護框架", "evidence_grade": "待補", "verified": false, "verified_date": "", "supports": [], "tags": ["老年醫學", "待查核"]}, "body": "# 4M 高齡友善照護框架\n\n> ⚠️ **#待查核** — 奠基文獻佔位，引用前必須回核。\n\n## 為什麼要收\n「先問對你最重要的是什麼」的臨床落地框架。\n\n## 待補\n- [ ] 完整引用 / 全文數字 / 查核後改 verified\n"}, {"id": "AWGS 2025 肌少症診斷標準", "folder": "02 老年醫學證據庫", "file": "AWGS 2025 肌少症診斷標準", "title": "AWGS 2025 肌少症診斷標準", "fm": {"type": "evidence", "citation": "Chen L-K, Hsiao F-Y, Akishita M, et al. A focus shift from sarcopenia to muscle health in the Asian Working Group for Sarcopenia 2025 Consensus Update. Nat Aging. 2025. https://doi.org/10.1038/s43587-025-01004-y", "year": 2025, "journal": "Nature Aging", "study_type": "國際共識指引（亞洲肌少症工作小組 AWGS）", "evidence_grade": "強（共識指引）", "verified": true, "verified_date": "2026-06-23", "supports": ["[[S4 Strength 厚積薄發]]", "[[Lu 2026 華人肌肉量常模]]"], "aliases": ["AWGS 2025", "肌少症診斷", "肌肉健康"], "tags": ["肌少症", "診斷標準", "ASMI", "握力"]}, "body": "# AWGS 2025 肌少症診斷標準\n\n📄 **原文**：https://doi.org/10.1038/s43587-025-01004-y （Nature Aging，付費訂閱、有版權）\n📎 **庫內 PDF**：[下載原始全文](<_原始文獻/AWGS 2025 肌少症診斷標準.pdf>)\n\n## 一句話結論\nAWGS 2025（亞洲肌少症工作小組共識更新，Nature Aging）把焦點從「肌少症」轉向「肌肉健康」：診斷下放到中年（50–64 歲）、演算法簡化為「低肌肉量＋低肌力」兩項並存即確診、並取消「嚴重肌少症」分級。它給的是**診斷切點**，不是依齡常模曲線。\n\n## 三大更新\n1. **下放中年**：新增 50–64 歲的診斷切點（取自亞洲多世代彙整的最低五分位）。\n2. **簡化演算法**：確診只需「低肌肉量 ＋ 低肌力」並存；體能表現（physical performance）改列為**結果指標**、不再是診斷條件。\n3. **肌肉健康框架**：把骨骼肌視為健康長壽核心，強調與腦、骨、脂肪、免疫的 cross-talk，並接軌 WHO ICOPE 做個案發現。\n\n## 關鍵數字（診斷切點）\n**握力（手握力計）**\n- ≥65 歲：男 <28 kg、女 <18 kg\n- 50–64 歲：男 <34 kg、女 <20 kg\n\n**四肢骨骼肌質量指數 ASMI（身高校正）**\n- ≥65 歲：DXA 男 <7.0、女 <5.4 kg/m²；BIA 男 <7.0、女 <5.7 kg/m²\n- 50–64 歲：DXA 男 <7.2、女 <5.5 kg/m²；BIA 男 <7.6、女 <5.7 kg/m²\n- （另提供 BMI 校正切點）\n\n**個案發現**：小腿圍 男 <34 cm、女 <33 cm；SARC-F ≥4；SARC-CalF ≥11；手指環（Yubi-wakka）測試。\n**流行病學**：亞洲 ≥60 歲社區肌少症盛行率約 16.5%（可能肌少症 28.7%）；台灣約 17.6%。\n\n## ⚠️ 使用眉角\n- **切點≠常模**：診斷切點用來判斷「有沒有肌少症」，不能拿來描述「同齡人平均多少」。台灣常見的「40 歲後每十年掉 8%、70 後 15%」缺乏可追溯原始出處，當概念近似值、別當可引用硬數字——常模要看 [[Lu 2026 華人肌肉量常模]]／[[Wang 2024 華人肌肉量軌跡]]。\n- **「可能肌少症」≠診斷**：只有低握力、未測肌肉量時稱 possible sarcopenia，是啟動介入的訊號、不是確診分類。\n- **體能表現被降級**：步速等改當結果指標、不再進診斷流程——沿用舊 AWGS 2019 流程的衛教要更新。\n- **介入主軸**：阻力運動 ＋ 營養（蛋白質）多模式介入。\n- 握力是診斷核心；其方便的 BIA 替代量測學見 [[Lee 2020 站立式BIA預測握力]]。\n\n## 支撐主張\n- [[S4 Strength 厚積薄發]]\n- [[Lu 2026 華人肌肉量常模]]\n"}, {"id": "Boyd 2008 出院後ADL恢復", "folder": "02 老年醫學證據庫", "file": "Boyd 2008 出院後ADL恢復", "title": "Boyd 2008 — 出院後 ADL 恢復", "fm": {"type": "evidence", "citation": "Boyd CM, et al. Recovery of activities of daily living in older adults after hospitalization for acute medical illness. J Am Geriatr Soc. 2008;56(12):2171-9.", "year": 2008, "journal": "J Am Geriatr Soc", "study_type": "前 ": "DXA 生命歷程軌跡（至 60 歲）", "evidence_grade": "中", "verified": true, "verified_date": "2026-06-16", "supports": ["[[S4 Strength 厚積薄發]]", "[[Lu 2026 華人肌肉量常模]]"], "aliases": ["Wang 2024", "肌肉軌跡"], "tags": ["肌少症", "DXA", "華人"]}, "body": "# Wang 2024 華人肌肉量軌跡\n\n## 一句話結論\nDXA 量測華人成人至 60 歲的肌肉量生命歷程軌跡，並與美國 NHANES 比較。\n\n## 關鍵數字 / 設計\n- DXA 為主、涵蓋至 60 歲（與 Lu 2026 的 BIA、20–80 歲互補）\n\n## ⚠️ 使用眉角\n與 Lu 2026 並用，建立華人肌肉量的雙來源佐證。\n\n## 支撐主張\n- [[S4 Strength 厚積薄發]]\n- [[Lu 2026 華人肌肉量常模]]\n"}, {"id": "_證據庫索引", "folder": "02 老年醫學證據庫", "file": "_證據庫索引", "title": "📚 老年醫學證據庫 — 索引", "fm": {"type": "moc", "tags": ["moc", "證據庫"]}, "body": "# 📚 老年醫學證據庫 — 索引\n\n地基。原則：**引用前一律查核，單一觀察性研究不足以支撐學術論述。**\n\n## ✅ 已查核\n**老化軌跡 / 斷崖**\n- [[Snyder 2024 非線性老化 44-60]]\n- [[Lehallier 2019 血漿蛋白體老化波]]\n- [[Pontzer 2021 代謝壽命曲線]]\n\n**失能 / 衰弱**\n- [[Covinsky 2003 住院相關失能]]\n- [[Boyd 2008 出院後ADL恢復]]\n- [[Simpson 2026 SGLT2i 衰弱]]\n\n**認知 / 失智**\n- [[Rayens 2026 帶疱疫苗與失智]]\n- [[國衛院 2026 APOE-ε4 認知退化]]\n\n**代謝 / 抗老 / 營養**\n- [[CALERIE 熱量限制與生物老化]]\n- [[Oxford 2022 酒精與端粒]]\n- [[Sydney 2026 減脂優於換植物蛋白]]\n\n**肌少症 / 肌肉量**\n- [[EMBRAZE 2026 apitegromab 保肌]]\n- [[Lu 2026 華人肌肉量常模]]\n- [[Wang 2024 華人肌肉量軌跡]]\n- [[AWGS 2025 肌少症診斷標準]]\n- [[Lee 2020 站立式BIA預測握力]]\n\n## ⏳ 待查核（奠基文獻，用前必須回核）\n- [[Gill 2004 失能發展]]\n- [[Fried 2001 衰弱表型]]\n- [[Rockwood 2007 缺損指數]]\n- [[Lee 用藥獲益時程 time-to-benefit]]\n- [[4M 高齡友善照護框架]]\n\n## 自動清單（需 Dataview 外掛）\n````\n```dataview\nTABLE year AS 年份, journal AS 期刊, study_type AS 設計, evidence_grade AS 強度, verified AS 已查核\nFROM \"02 老年醫學證據庫\"\nWHERE type = \"evidence\"\nSORT verified DESC, year DESC\n```\n````\n"}, {"id": "國衛院 2026 APOE-ε4 認知退化", "folder": "02 老年醫學證據庫", "file": "國衛院 2026 APOE-ε4 認知退化", "title": "國衛院 2026 APOE-ε4 認知退化", "fm": {"type": "evidence", "citation": "國衛院 HALST 世代（陳為堅團隊）APOE ε4 與認知退化軌跡。JAMA Netw Open. 2026.（n=4,392，已核對主要數字）", "year": 2026, "journal": "JAMA Netw Open", "study_type": "台灣本土長期世代（n=4,392，≥55 歲，6 年）", "evidence_grade": "中", "verified": true, "verified_date": "2026-06-16", "supports": ["[[失智可改變風險因子]]", "[[S6 Sharpness 機先一著]]", "[[三大健康斷崖]]"], "aliases": ["國衛院 HALST", "APOE ε4"], "tags": ["失智", "基因", "台灣本土"]}, "body": "# 國衛院 2026 APOE-ε4 認知退化\n\n## 一句話結論\n台灣本土資料：帶 APOE ε4 者認知退化顯著加速，70 歲後差距越拉越大；帶兩個 ε4 者發病提早 7–10 年。\n\n## 關鍵數字 / 設計\n- 本研究測的是**退化速率（MMSE 斜率）**，不是「阿茲海默風險倍數」\n- 「ε4 風險 3–5 倍／10–15 倍」是國際背景文獻、**不是這篇算的**，別張冠李戴\n- 這篇沒有測膳食纖維——勿把纖維發現黏到這篇身上\n\n## ⚠️ 使用眉角\n本土＝對台灣受眾的硬證據；用時把「退化加速＋提早 7–10 年」歸功給它真正的發現。\n\n## 支撐主張\n- [[失智可改變風險因子]]\n- [[S6 Sharpness 機先一著]]\n- [[三大健康斷崖]]\n"}, {"id": "GLP-1 減重藥與肌肉流失", "folder": "03 臨床主題", "file": "GLP-1 減重藥與肌肉流失", "title": "GLP-1 減重藥與肌肉流失", "fm": {"type": "topic", "verified": true, "verified_date": "2026-06-16", "supports": ["[[EMBRAZE 2026 apitegromab 保肌]]", "[[S4 Strength 厚積薄發]]", "[[S5 Sustenance 藥食同源]]"], "tags": ["臨床主題", "GLP-1", "肌少症", "代謝"]}, "body": "# GLP-1 減重藥與肌肉流失\n\n## 一句話結論\n瘦瘦針強制關閉食慾減重時，流失的有 25–40% 是瘦體組織；停藥沒策略，反彈幾乎都是脂肪、肌肉回不來。\n\n## 核心論述\n- GLP-1 減重時，約 **25–40%** 減去的是瘦體組織（lean mass，涵蓋肌肉，但不只肌肉——用「不是脂肪」要鬆一點）。\n- 停藥後反彈以脂肪為主、肌肉不跟著回來 → **肌少型肥胖(sarcopenic obesity)**，高齡尤危（放大胰島素阻抗、增衰弱）。\n- BMJ 統合分析：停藥後反彈**速度**約是飲食減重者的 4 倍（約 1.5 年回到原點）。\n- 解方曙光：[[EMBRAZE 2026 apitegromab 保肌]]（保肌藥，仍 Phase 2）。未來＝減脂藥＋保肌藥雙核心。\n\n## 周邊事實（已查核，正式引用前再核精確數字）\n- **orforglipron(Foundayo)**：FDA 核准、口服小分子、最高劑量平均減重約 12.4%、為 2002 年以來最快 NME 核准。\n- **印度學名藥**：semaglutide 專利 2026/3/20 到期，48 小時內 >15 版上市，價格最高崩 90%。\n- **台灣 BMI 24 用藥**：三層條件缺一不可——BMI 24–27＋腰圍超標且至少一項共病＋生活型態調整 3–6 個月未達標，才「可」用藥。藥是第二道防線。\n- 台灣 GLP-1 數據：減重約 75.3% 來自脂肪。\n\n## 連結\n- 證據：[[EMBRAZE 2026 apitegromab 保肌]]\n- 支柱：[[S4 Strength 厚積薄發]]（保肌）、[[S5 Sustenance 藥食同源]]（代謝）\n"}, {"id": "_臨床主題索引", "folder": "03 臨床主題", "file": "_臨床主題索引", "title": "🩺 臨床主題 — 索引", "fm": {"type": "moc", "tags": ["moc", "臨床主題"]}, "body": "# 🩺 臨床主題 — 索引\n\n各臨床議題整理區，每篇連回對應的 9S 支柱與證據。\n\n## 代謝 / 體重 / 營養\n- [[GLP-1 減重藥與肌肉流失]]\n- [[熱量限制與間歇性斷食]]\n- [[酒精與華人老化]]\n- [[抗老保健品的真相]]\n- [[血脂與動脈斑塊回春]]\n- [[心臟回春]]\n\n## 認知 / 失智\n- [[失智可改變風險因子]]\n"}, {"id": "失智可改變風險因子", "folder": "03 臨床主題", "file": "失智可改變風險因子", "title": "失智可改變風險因子", "fm": {"type": "topic", "verified": true, "verified_date": "2026-06-16", "supports": ["[[Rayens 2026 帶疱疫苗與失智]]", "[[國衛院 2026 APOE-ε4 認知退化]]", "[[S6 Sharpness 機先一著]]", "[[S7 Sensitivity 感而遂通]]"], "tags": ["臨床主題", "失智", "預防", "認知"]}, "body": "# 失智可改變風險因子\n\n## 一句話結論\n基因不能改，但很多風險因子可以。其中聽力受損是中年最大的可改變失智風險因子之一。\n\n## 已查核的可改變因子\n- **聽力**：Lancet 失智委員會結論——聽力受損是中年占比最大的可改變風險因子之一。護耳就是護腦（60/60 原則：音量<60%、連續<60 分鐘）。連結 [[S7 Sensitivity 感而遂通]]。\n- **帶狀疱疹疫苗**：[[Rayens 2026 帶疱疫苗與失智]]（65+，降 51%／校正偏差後約 27%；觀察性）。\n- **基因（不可改但可知）**：[[國衛院 2026 APOE-ε4 認知退化]]（ε4 加速退化、帶兩個提早 7–10 年）。\n\n## ⚠️ 被打臉的數字（勿用）\n- 「每天多 5 克膳食纖維 → 認知下降風險降 30%」：**查無對應原始來源**，且國衛院那篇根本沒測纖維。纖維與認知的關聯多為觀察性（如 Rush MAP 2026：最高五分位約 27g/天 vs 最低，降 46%——是組間比較不是「每 5 克」）。\n\n## 連結\n- 支柱：[[S6 Sharpness 機先一著]]、[[S7 Sensitivity 感而遂通]]、[[S2 Sleep 天人合一]]（深睡清膠淋巴）\n"}, {"id": "心臟回春", "folder": "03 臨床主題", "file": "心臟回春", "title": "心臟回春", "fm": {"type": "topic", "verified": false, "supports": ["[[S4 Strength 厚積薄發]]"], "tags": ["臨床主題", "心血管", "抗衰老", "待查核"]}, "body": "# 心臟回春\n> ⚠️ #待查核 — 多為動物研究／前沿。\n生活方式(臨床已驗證) > Senolytic/SGLT2i(動物為主) > GDF11(爭議) > BPIFB4(臨床前)\n## 連結\n- [[S4 Strength 厚積薄發]]、[[Simpson 2026 SGLT2i 衰弱]]\n"}, {"id": "抗老保健品的真相", "folder": "03 臨床主題", "file": "抗老保健品的真相", "title": "抗老保健品的真相", "fm": {"type": "topic", "verified": true, "verified_date": "2026-06-16", "supports": ["[[S5 Sustenance 藥食同源]]"], "tags": ["臨床主題", "保健品", "抗老", "實證"]}, "body": "# 抗老保健品的真相\n\n## 一句話結論\n對營養充足的健康成人，抗老保健品的大型試驗多顯示效果極小或有害；真正受益的是「確有缺乏」的人。\n\n## 大型試驗（已查核，引用前再核精確值）\n- **ATBC（NEJM 1994）**：β-胡蘿蔔素讓吸菸者肺癌風險升約 18%。\n- **Linxian（中國）對照案例**：在**真正營養不良**族群，β-胡蘿蔔素反而降低死亡率——支持「補充劑只對確有缺乏者有益」。\n- SELECT、Physicians' Health Study II、glucosamine（BMJ Wandel 分析）：健康族群多無顯著益處。\n- **順勢療法**：NHMRC 2015（225 對照試驗）、Lancet 2005 Shang 統合分析——效果與安慰劑無異。用「證據語言」收尾，不用「偽科學」一詞。\n\n## 臨床立場\n有感、成分可信、花費可負擔→繼續用無妨（安慰劑效應是真的）；重視證據者→停用無風險。\n\n## 連結\n- 支柱：[[S5 Sustenance 藥食同源]]\n"}, {"id": "熱量限制與間歇性斷食", "folder": "03 臨床主題", "file": "熱量限制與間歇性斷食", "title": "熱量限制與間歇性斷食", "fm": {"type": "topic", "verified": true, "verified_date": "2026-06-16", "supports": ["[[CALERIE 熱量限制與生物老化]]", "[[S5 Sustenance 藥食同源]]"], "tags": ["臨床主題", "代謝", "斷食", "抗老"]}, "body": "# 熱量限制與間歇性斷食\n\n## 一句話結論\n人體證據最硬的共同分母只有一個——熱量赤字。168 真正在身上發生的事，多半不是自噬，是你不知不覺吃少了。\n\n## 分子機制 vs 人體結論（必分清）\n| 主題 | 分子（細胞/動物） | 人體 RCT 實際 |\n|---|---|---|\n| 熱量限制 | AMPK↑ mTOR↓ 自噬 | [[CALERIE 熱量限制與生物老化]]：DunedinPACE 慢 2–3% |\n| 進食時間 | 時鐘基因、胰島素節律 | TREATY：熱量配平下 8h 限時 vs 不限時，8.0 對 6.3 kg，**未達顯著** |\n| 酮體 BHB | 抑制 NLRP3、HDAC | 人體斷食 BHB 常低於有效門檻 |\n| 自噬 | mTOR↓/AMPK↑（動物穩健） | 2025 才在人體勉強測到（121 人，p=0.04 事後分析，組內未顯著） |\n\n## 眉角\n- 「168 = 自噬開關」是動物外推；人體證據很薄。\n- ChronoFast：等熱量限時進食會移動生理時鐘，卻沒改善代謝。\n- 行動順位：先顧**總量**（唯一 RCT 撐得起）→ 想加碼再玩**時間**（往早挪）→ 自噬／酮體當紅利別當主菜。\n\n## 連結\n- 證據：[[CALERIE 熱量限制與生物老化]]\n- 支柱：[[S5 Sustenance 藥食同源]]\n"}, {"id": "血脂與動脈斑塊回春", "folder": "03 臨床主題", "file": "血脂與動脈斑塊回春", "title": "血脂與動脈斑塊回春", "fm": {"type": "topic", "verified": false, "supports": ["[[S5 Sustenance 藥食同源]]"], "tags": ["臨床主題", "心血管", "LDL", "待查核"]}, "body": "# 血脂與動脈斑塊回春\n> ⚠️ #待查核 — 試驗名稱與數字待回核。\nLDL 降越低越久、斑塊退縮越佳；Statin+Ezetimibe+PCSK9i 最積極。\n- 待回核：GLAGOV、PACMAN-AMI、SATURN、LDL 目標分層\n## 連結\n- [[S5 Sustenance 藥食同源]]\n"}, {"id": "酒精與華人老化", "folder": "03 臨床主題", "file": "酒精與華人老化", "title": "酒精與華人老化", "fm": {"type": "topic", "verified": true, "verified_date": "2026-06-16", "supports": ["[[Oxford 2022 酒精與端粒]]", "[[S5 Sustenance 藥食同源]]"], "tags": ["臨床主題", "酒精", "老化", "華人"]}, "body": "# 酒精與華人老化\n\n## 一句話結論\n臉紅不是代謝快，是身體求救。酒精每次能蒙混過關，都是因為它穿了「藥」或「補」的外衣。\n\n## 核心論述\n- [[Oxford 2022 酒精與端粒]]：>17 單位/週端粒變短（約老 1–3 歲），依賴者約三倍。\n- **ALDH2 缺損**：約 30–40% 東亞人帶突變 → 乙醛清不掉 → 臉紅、心悸。別人喝是微傷，我們喝像過敏。\n- 酒精＝一級致癌物，**無安全劑量**。\n\n## 破迷思\n- **藥酒**：用酒精萃取藥材化學上成立，但「喝下去有益」未證實；藥廠萃完會把酒精蒸掉，你卻是連致癌物一起吞。\n- **月子米酒**：酒精會抑制催產素（噴乳反射）→ 喝米酒「發奶」講反了。「煮一下就揮發」是錯的——USDA：燉 15 分鐘留 40%、1 小時留 25%、2.5 小時才剩 5%。\n\n## 連結\n- 證據：[[Oxford 2022 酒精與端粒]]\n- 支柱：[[S5 Sustenance 藥食同源]]\n"}, {"id": "範本 臨床主題", "folder": "_範本", "file": "範本 臨床主題", "title": "（主題名）", "fm": {"type": "topic", "verified": false, "supports": [], "tags": ["臨床主題", "待查核"]}, "body": "# （主題名）\n> ⚠️ #待查核\n## 核心論述\n## 關鍵證據\n## 連結\n- 支柱：[[ ]]\n"}, {"id": "範本 證據文獻", "folder": "_範本", "file": "範本 證據文獻", "title": "（文獻短名）", "fm": {"type": "evidence", "citation": "", "year": "", "journal": "", "study_type": "", "evidence_grade": "", "verified": false, "verified_date": "", "supports": [], "aliases": [], "tags": ["待查核"]}, "body": "# （文獻短名）\n> ⚠️ #待查核\n## 一句話結論\n## 研究設計\n## 關鍵數字\n## ⚠️ 使用眉角\n## 支撐主張\n- [[ ]]\n"}, {"id": "_說明", "folder": "_原始文獻", "file": "_說明", "title": "_原始文獻", "fm": {}, "body": "# _原始文獻\n\n存放證據筆記對應的原始 PDF 全文，檔名與 `02 老年醫學證據庫/` 的筆記對齊，方便調出正本。\n\n| 檔案 | 來源 | 版權／授權 | 對應筆記 |\n|---|---|---|---|\n| `Lee 2020 站立式BIA預測握力.pdf` | PLoS ONE 2020;15(6):e0231604 | ✅ 開放取用 **CC-BY**（可自由散布） | [[Lee 2020 站立式BIA預測握力]] |\n| `AWGS 2025 肌少症診斷標準.pdf` | Nature Aging 2025（DOI 10.1038/s43587-025-01004-y） | ⚠️ **付費訂閱、版權所有（Springer Nature）** | [[AWGS 2025 肌少症診斷標準]] |\n\n> ⚠️ **版權提醒**：本 repo 目前為**公開**。`AWGS 2025` 為非開放取用之版權內容，公開托管全文 PDF 可能構成侵權。\n> 若有疑慮，建議：(1) 移除該 PDF、僅保留筆記內的 DOI 連結；或 (2) 將 repo 轉為私人。\n"}];

const GROUPS=[".","01 9S框架","02 老年醫學證據庫","03 臨床主題","_範本"];
const GLABEL={".":"入口 · 索引","01 9S框架":"9S 框架","02 老年醫學證據庫":"老年醫學證據庫","03 臨床主題":"臨床主題","_範本":"範本"};
function vclass(n){if(n.fm.type==="evidence"||n.fm.type==="topic")return n.fm.verified===true?"v":"u";return "n";}
const okEv=NOTES.filter(n=>n.fm.type==="evidence"&&n.fm.verified===true).length;
const pending=NOTES.filter(n=>n.fm.verified===false&&n.folder!=="_範本").length;
document.getElementById("stats").innerHTML=
 `<div class="stat"><b>${NOTES.length}</b><span>筆記</span></div>`+
 `<div class="stat"><b>${okEv}</b><span>已查核</span></div>`+
 `<div class="stat"><b>${pending}</b><span>待查核</span></div>`;
function buildNav(filter=""){
  const nav=document.getElementById("nav");
  let h=`<div class="hubrow" id="hubbtn">⌂ Hub 首頁</div><div class="search"><input id="q" placeholder="搜尋筆記…" value="${filter}"></div>`;
  GROUPS.forEach(g=>{
    let items=NOTES.filter(n=>n.folder===g);
    if(filter) items=items.filter(n=>n.title.toLowerCase().includes(filter.toLowerCase()));
    if(!items.length) return;
    h+=`<div class="group-h">${GLABEL[g]||g}</div>`;
    items.forEach(n=>{h+=`<div class="item" data-id="${n.id}"><span class="dot ${vclass(n)}"></span>${n.title}</div>`;});
  });
  nav.innerHTML=h;
  nav.querySelectorAll(".item").forEach(el=>el.onclick=()=>{open(el.dataset.id);if(window.innerWidth<=760)nav.classList.remove("open");});
  const hb=document.getElementById("hubbtn"); if(hb) hb.onclick=()=>{renderHub();if(window.innerWidth<=760)nav.classList.remove("open");};
  const q=document.getElementById("q"); q.oninput=e=>buildNav(e.target.value); q.focus(); q.setSelectionRange(filter.length,filter.length);
}
function preprocess(md){return md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,t,a)=>{const disp=(a||t).trim();const id=resolve(t.trim());return id?`<a class="wl" data-nav="${id}">${disp}</a>`:`<a class="wl broken" title="尚未建立">${disp}</a>`;});}
function supportsHtml(n){const s=n.fm.supports||[];return s.map(item=>{const m=String(item).match(/\[\[([^\]|]+)\]\]/);if(m){const id=resolve(m[1].trim());return id?`<span class="chip link" data-nav="${id}">${m[1].trim()}</span>`:`<span class="chip">${m[1].trim()}</span>`;}return `<span class="chip">${item}</span>`;}).join("");}
function pstep(n,t,d){return `<div class="pstep"><div class="n">${n}</div><div class="t">${t}</div><div class="d">${d}</div></div>`;}
function renderHub(){
  document.querySelectorAll(".item").forEach(e=>e.classList.remove("active"));
  const hb=document.getElementById("hubbtn"); if(hb) hb.classList.add("active");
  const pillars=NOTES.filter(n=>n.fm.type==="pillar"&&n.fm.pillar_code&&n.fm.pillar_code!=="9S"&&n.fm.pillar_code!=="核心");
  const queue=NOTES.filter(n=>n.fm.verified===false&&n.folder!=="_範本");
  const ev=NOTES.filter(n=>n.fm.type==="evidence"&&n.fm.verified===true);
  const pipe=`<div class="pipe">`+pstep("1","看到醫學資訊","期刊・新聞・同行觀察")+`<div class="parrow">→</div>`+
    pstep("2","Claude 查核・分析","驗證出處、核對數字、標證據強度")+`<div class="parrow">→</div>`+
    pstep("3","醫學知識庫","唯一真相來源，結構化歸檔")+`<div class="parrow">→</div>`+
    pstep("4","HTML Hub 呈現","從 vault 重生此頁，易讀")+
    `</div><div class="pipenote">＊ 步驟 3→4 的更新由 Mac 上的監看器重跑產生器完成；此頁為靜態快照。</div>`;
  const tiles=`<div class="tiles"><div class="tile"><b>${NOTES.length}</b><span>總筆記</span></div>`+
    `<div class="tile v"><b>${ev.length}</b><span>已查核文獻</span></div>`+
    `<div class="tile u"><b>${queue.length}</b><span>待查核</span></div>`+
    `<div class="tile"><b>${pillars.length}</b><span>9S 支柱</span></div></div>`;
  const qlist=queue.length?queue.map(n=>`<div class="qrow" data-nav="${n.id}">${n.title}<span class="qb">待查核</span></div>`).join(""):`<div class="pipenote">目前沒有待查核項目。</div>`;
  const evlist=ev.map(n=>`<div class="qrow" data-nav="${n.id}">${n.title}<span class="qb v">✓ ${n.fm.evidence_grade||""}</span></div>`).join("");
  const pgrid=`<div class="pgrid">`+pillars.map(n=>`<div class="pcard" data-nav="${n.id}"><div class="pc">${n.fm.pillar_code} ${n.fm.pillar_en||""}</div><div class="pp">${n.fm.philosophy||""}</div></div>`).join("")+`</div>`;
  document.getElementById("reading").innerHTML=`<div class="hub"><div class="crumb">HUB · 知識層控制台</div>`+
    `<div class="note"><h1>叮噹長壽知識庫</h1></div>`+
    `<div class="lede">看到醫學資訊 → 我查核分析 → 存進醫學知識庫（真相來源）→ 重生這個 HTML 門面。以下是目前的庫存與待辦。</div>`+
    pipe+tiles+`<div class="sect">⏳ 待查核佇列</div>${qlist}`+`<div class="sect">✅ 已查核文獻</div>${evlist}`+`<div class="sect">🧭 9S 支柱</div>${pgrid}</div>`;
  document.querySelectorAll("[data-nav]").forEach(el=>el.onclick=()=>open(el.dataset.nav));
  document.querySelector("main").scrollTop=0;
}
function open(id){
  const n=byId[id]; if(!n) return;
  document.querySelectorAll(".item").forEach(e=>e.classList.toggle("active",e.dataset.id===id));
  const hb=document.getElementById("hubbtn"); if(hb) hb.classList.remove("active");
  const f=n.fm; let rows="";
  const add=(k,v)=>{if(v!==undefined&&v!==""&&!(Array.isArray(v)&&!v.length))rows+=`<div class="row"><div class="k">${k}</div><div class="val">${v}</div></div>`;};
  if(f.type)add("類型",f.type); if(f.citation)add("引用",f.citation); if(f.study_type)add("研究設計",f.study_type);
  if(f.evidence_grade)add("證據強度",f.evidence_grade); if(f.philosophy)add("東方哲學",f.philosophy);
  if(f.type==="evidence"||f.type==="topic"){const ok=f.verified===true;add("查核狀態",`<span class="badge ${ok?'v':'u'}">${ok?'✓ 已查核':'⏳ 待查核'}</span>`+(f.verified_date?` <span style="color:var(--muted);font-size:11px">${f.verified_date}</span>`:""));}
  const sup=supportsHtml(n); if(sup)add("支撐／連結",sup);
  const tg=(f.tags||[]).map(x=>`<span class="chip">#${x}</span>`).join(""); if(tg)add("標籤",tg);
  let body=n.body.replace(/^#\s+.+$/m,"").trim(); body=preprocess(body);
  let rendered=marked.parse(body,{breaks:false,gfm:true});
  rendered=rendered.replace(/(^|[\s(（>])#([\u4e00-\u9fa5A-Za-z0-9_\/]+)/g,'$1<span class="tag">#$2</span>');
  document.getElementById("reading").innerHTML=`<div class="crumb">${GLABEL[n.folder]||n.folder}</div>`+
    `<div class="note"><h1>${n.title}</h1></div>`+(rows?`<div class="props">${rows}</div>`:"")+
    `<div class="note">${rendered}</div>`+
    `<div class="hint">唯讀預覽。點 [[連結]] 可在筆記間跳轉；改完 .md 後重跑 _tools/產生HTML.py 即更新此頁。</div>`;
  document.querySelectorAll("[data-nav]").forEach(el=>el.onclick=()=>open(el.dataset.nav));
  document.querySelector("main").scrollTop=0;
}
buildNav(); renderHub();
</script></body></html>
